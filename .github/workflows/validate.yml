name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant / HACS releases.
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # fints_atruvia is not registered in home-assistant/brands, so the
          # brands check can never pass here. Drop this once a brands PR lands.
          ignore: brands

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      # Version pinned on purpose: a new ruff release must not turn the build
      # red overnight. Bump it deliberately, together with the local runs
      # documented in CLAUDE.md.
      - run: uvx ruff@0.16.2 check .
      - run: uvx ruff@0.16.2 format --check .

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv venv --python 3.14
      - run: uv pip install -r requirements.txt
      - run: PYTHONPATH=$PWD .venv/bin/pytest
